name: Go Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.26"
      - run: make build
        env:
          GO: go
          CGO_ENABLED: 0

  cross-platform-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux targets (cross-compiled from ubuntu-latest)
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          #          - os: ubuntu-latest
          #            goos: linux
          #            goarch: 386
          # Windows targets
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            goos: windows
            goarch: arm64
          #          - os: ubuntu-latest
          #            goos: windows
          #            goarch: 386
          # macOS targets (cross-compiled from ubuntu-latest)
          - os: ubuntu-latest
            goos: darwin
            goarch: amd64
          - os: ubuntu-latest
            goos: darwin
            goarch: arm64
          # BSD targets (cross-compiled from ubuntu-latest)
          - os: ubuntu-latest
            goos: freebsd
            goarch: amd64
          - os: ubuntu-latest
            goos: openbsd
            goarch: amd64
          - os: ubuntu-latest
            goos: netbsd
            goarch: amd64
          # Android (cross-compiled from ubuntu-latest)
          - os: ubuntu-latest
            goos: android
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.26"
      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
        env:
          CGO_ENABLED: 0

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26" # Adjust this version as needed
          # setup-go@v4 caches ~/go/pkg/mod and ~/.cache/go-build by default,
          # keyed on go.sum. A second manual actions/cache on those same paths
          # used to collide with it ("Failed to restore: tar ... exit code 2" /
          # "Cannot open: File exists"), leaving the build cache cold so the
          # heavy lib/router package recompiled from scratch and hit the 10m
          # per-package test timeout on loaded runners. Rely on setup-go's cache.
          cache: true

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Run all tests
        # -timeout 20m raises the per-package test timeout above the 10m
        # default: lib/router runs full network bootstrap in several tests and
        # sits near the default limit on a loaded shared runner, where it
        # otherwise flakes with "panic: test timed out after 10m0s".
        run: go test -timeout 20m ./...
        env:
          GO: go
          DEBUG_I2P: debug
          GO_I2P_INTEGRATION_NAT: inactive
          CGO_ENABLED: 0

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.test_target }}-logs
          path: ./test-logs/${{ matrix.test_target }}.log # Adjust this path as needed

  fuzz:
    # Short fuzzing of the C3 parse/decrypt cluster (LeaseSet2, STBM build-record
    # crypto, garlic/ECIES decrypt, I2PControl request/auth). The seed corpora
    # also replay in the `test` job via `go test ./...`; this job adds bounded
    # mutation coverage so a new panic in the untrusted-input parsers is caught
    # in CI. A panic fails the job and is uploaded as an artifact.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26"

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-fuzz-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Fuzz parse/decrypt cluster
        run: |
          go test ./lib/netdb/ -run '^$' -fuzz FuzzReadLeaseSet2 -fuzztime=30s
          go test ./lib/i2np/ -run '^$' -fuzz FuzzBuildRecordCrypto -fuzztime=30s
          go test ./lib/i2np/ -run '^$' -fuzz FuzzGarlicDecrypt -fuzztime=30s
          go test ./lib/i2pcontrol/ -run '^$' -fuzz FuzzI2CPControlAuth -fuzztime=30s
        env:
          CGO_ENABLED: 0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m
